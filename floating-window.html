<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLabs — Floating Scores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="floating-window.js" defer></script>
    <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --navy:     #041e42;
        --navy-mid: #0d2d5e;
        --red:      #bf0d3d;
        --bg:       #f0f4f8;
        --surface:  #ffffff;
        --surface-2:#f7fafc;
        --text:     #041e42;
        --muted:    rgba(4,30,66,0.42);
        --muted-2:  rgba(4,30,66,0.6);
        --border:   rgba(4,30,66,0.11);
        --shadow:   0 1px 4px rgba(4,30,66,0.08);
    }

    html { scrollbar-width: thin; scrollbar-color: var(--red) transparent; }

    body {
        font-family: 'Rubik', sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────── */
    .page-header {
        background: linear-gradient(135deg, var(--navy), var(--navy-mid));
        padding: 9px 14px;
        display: flex;
        align-items: center;
        gap: 9px;
        flex-shrink: 0;
    }

    .header-logo  { width: 26px; height: 26px; object-fit: contain; flex-shrink: 0; }

    .header-title {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: white;
        flex: 1;
    }

    /* ── Date bar ───────────────────────────────────────── */
    .date-bar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 6px 12px;
        display: flex;
        align-items: center;
        gap: 7px;
        flex-shrink: 0;
    }

    .date-arrow {
        width: 24px; height: 24px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface-2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.14s;
        flex-shrink: 0;
        padding: 0;
    }
    .date-arrow:hover     { background: var(--navy); border-color: var(--navy); }
    .date-arrow:hover svg { stroke: white; }
    .date-arrow svg {
        width: 11px; height: 11px;
        stroke: var(--muted);
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .date-display-wrap { position: relative; flex: 1; min-width: 0; }
    .date-display {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 5px 9px;
        cursor: pointer;
        user-select: none;
        transition: border-color 0.14s;
    }
    .date-display:hover { border-color: var(--navy); background: var(--surface); }
    .date-display svg {
        width: 12px; height: 12px;
        stroke: var(--red);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
    }
    .date-display-text {
        font-family: 'Rubik', sans-serif;
        font-size: 10px;
        font-weight: 600;
        color: var(--text);
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .date-input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
    }
    .today-btn {
        font-family: 'Rubik', sans-serif;
        font-size: 9px;
        font-weight: 700;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 9px;
        cursor: pointer;
        transition: all 0.14s;
        flex-shrink: 0;
    }
    .today-btn:hover { border-color: var(--red); color: var(--red); }

    /* ── Games area ─────────────────────────────────────── */
    #scorebug {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 10px 12px 8px;
        scrollbar-width: thin;
        scrollbar-color: var(--red) transparent;
    }

    #games-container {
        display: grid;
        /* At default 610px window (586px content area):
         *   2×320 + 8 = 648 > 586 → 1 column
         * At ~660px+ content:
         *   2 columns (each 320–340px)
         * At ~990px+ content:
         *   3 columns
         */
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 10px;
    }

    /* ── Compact-gamebox base — all the rich detail ─────── */
    .compact-game-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 10px 11px 9px;
        cursor: pointer;
        transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .compact-game-box:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 16px rgba(191,13,61,0.13);
        border-color: rgba(191,13,61,0.3);
    }

    /* ── Pre-game ───────────────────────────────────────── */
    .compact-game-box.pre-game .compact-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
    }

    .compact-game-box.pre-game .team-info {
        display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0;
    }
    .compact-game-box.pre-game .team-info.away { justify-content: flex-start; }
    .compact-game-box.pre-game .team-info.home { justify-content: flex-end; }

    .compact-game-box.pre-game .team-logo-sm { width: 26px; height: 26px; flex-shrink: 0; }

    .compact-game-box.pre-game .team-abbr {
        font-weight: 700; font-size: 13px; color: var(--text);
    }
    .compact-game-box.pre-game .team-record {
        font-family: 'DM Mono', monospace;
        font-size: 10px; color: var(--muted-2); font-weight: 500;
    }

    .compact-game-box.pre-game .game-time {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        color: var(--red);
        font-weight: 700;
        padding: 0 6px;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .compact-game-box.pre-game .pitchers-row {
        display: flex; justify-content: space-between; align-items: center; gap: 6px;
        padding: 8px 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
    }

    .compact-game-box.pre-game .pitcher {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
    }
    .compact-game-box.pre-game .pitcher.home {
        /* row-reverse alone packs items at the visual right (flex-start of the
           reversed axis). Setting justify-content: flex-end here would pull the
           content toward the LEFT, leaving empty space on the right edge. */
        flex-direction: row-reverse;
    }
    .compact-game-box.pre-game .pitcher-info {
        display: flex; flex-direction: column; gap: 1px; min-width: 0;
    }
    .compact-game-box.pre-game .pitcher.home .pitcher-info {
        text-align: right;
        align-items: flex-end;     /* mirrors the column so each line right-aligns */
    }

    .compact-game-box.pre-game .pitcher-label {
        font-size: 8px; color: var(--muted); text-transform: uppercase;
        letter-spacing: 0.6px; font-weight: 700;
    }
    .compact-game-box.pre-game .pitcher-name {
        font-size: 11px; font-weight: 700; color: var(--text);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .compact-game-box.pre-game .pitcher-stats {
        font-family: 'DM Mono', monospace;
        font-size: 9px; color: var(--muted-2); font-weight: 500;
    }

    /* TBD placeholder for unannounced probable pitchers */
    .compact-game-box.pre-game .pitcher-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        color: var(--muted);
    }
    .compact-game-box.pre-game .pitcher-placeholder svg {
        width: 14px;
        height: 14px;
    }
    .compact-game-box.pre-game .pitcher-tbd .pitcher-name {
        color: var(--muted-2);
        font-style: italic;
    }
    .compact-game-box.pre-game .pitcher-tbd .pitcher-stats {
        color: var(--muted);
    }

    .compact-game-box.pre-game .vs-divider {
        font-size: 10px; color: var(--muted); font-weight: 700;
        padding: 0 4px; flex-shrink: 0;
    }

    /* ── Live game ──────────────────────────────────────── */
    .compact-game-box.live-game { border-left: 3px solid var(--red); }

    .compact-game-box.live-game .live-header {
        display: flex; align-items: center; gap: 6px;
    }
    .compact-game-box.live-game .team-score-row {
        display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0;
    }
    .compact-game-box.live-game .team-score-row.away { justify-content: flex-start; }
    .compact-game-box.live-game .team-score-row.home { justify-content: flex-end; flex-direction: row-reverse; }

    .compact-game-box.live-game .team-logo-md { width: 30px; height: 30px; flex-shrink: 0; }
    .compact-game-box.live-game .team-abbr-large {
        font-size: 12px; font-weight: 600; color: var(--text);
    }
    .compact-game-box.live-game .team-record-sm {
        font-family: 'Rubik', sans-serif;
        font-size: 7px; color: var(--muted-2); font-weight: 500;
    }

    /* Stack the logo and record vertically — saves horizontal space and
       gives the record its own line so it never wraps or gets squeezed */
    .compact-game-box.live-game .team-logo-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        flex-shrink: 0;
    }
    .compact-game-box.live-game .team-logo-stack .team-record-sm {
        white-space: nowrap;
    }
    .compact-game-box.live-game .score-large {
        font-family: 'Rubik', sans-serif;
        font-size: 22px; font-weight: 800; color: var(--text);
        min-width: 26px; text-align: center;
    }

    .compact-game-box.live-game .inning-indicator {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 2px;
        padding: 0 6px;
        flex-shrink: 0;
    }
    .compact-game-box.live-game .inning-text {
        font-family: 'DM Mono', monospace;
        font-size: 11px; font-weight: 700; color: var(--red); letter-spacing: 0.5px;
        white-space: nowrap;
    }

    /* Live ping ring */
    .live-ring { position: relative; width: 7px; height: 7px; flex-shrink: 0; }
    .live-ring::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--red); }
    .live-ring::before {
        content: ''; position: absolute; inset: -3px; border-radius: 50%;
        border: 1.5px solid var(--red); animation: livePing 1.6s ease-out infinite; opacity: 0;
    }
    @keyframes livePing {
        0%   { transform: scale(0.6); opacity: 0.9; }
        100% { transform: scale(2.2); opacity: 0; }
    }

    /* ── Final game ─────────────────────────────────────── */
    /* Single row: Away [logo abbr rec score]   FINAL   [score rec abbr logo] Home */
    .compact-game-box.final-game .final-header {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
    }

    .compact-game-box.final-game .team-final-row {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: 1;
        min-width: 0;
    }
    .compact-game-box.final-game .team-final-row.away { justify-content: flex-start; }
    .compact-game-box.final-game .team-final-row.home { justify-content: flex-end;   }

    .compact-game-box.final-game .team-logo-sm { width: 26px; height: 26px; flex-shrink: 0; }
    .compact-game-box.final-game .team-abbr {
        font-size: 13px; font-weight: 700; color: var(--text);
    }
    .compact-game-box.final-game .team-record {
        font-family: 'DM Mono', monospace;
        font-size: 10px; color: var(--muted-2); font-weight: 500;
    }
    .compact-game-box.final-game .final-label {
        font-size: 10px;
        color: var(--red);
        text-transform: uppercase;
        text-align: center;
        font-weight: 800;
        letter-spacing: 0.7px;
        padding: 0 6px;
        flex-shrink: 0;
    }
    .compact-game-box.final-game .score-md {
        font-family: 'Rubik', sans-serif;
        font-size: 20px; font-weight: 800; color: var(--text);
        min-width: 22px; text-align: center;
    }

    /* Winner emphasis on final games */
    .team-final-row.winner .score-md     { color: var(--text); font-weight: 800; }
    .team-final-row.winner .team-abbr    { color: var(--text); }
    .team-final-row.loser  .score-md     { color: var(--muted); font-weight: 700; }
    .team-final-row.loser  .team-abbr    { color: var(--muted); }
    .team-final-row.loser  .team-record  { color: var(--muted); }

    .compact-game-box.final-game .pitchers-final {
        display: flex; flex-wrap: wrap; gap: 8px;
        padding: 8px 0 0;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        justify-content: space-between;
    }

    /* ── Pitcher decision cards ─────────────────────────── */
    .pitcher-decision {
        display: flex; align-items: center; gap: 6px;
        flex: 1; min-width: 0;
    }
    .pitcher-decision-info {
        display: flex; flex-direction: column; gap: 1px; min-width: 0;
    }
    .pitcher-result {
        font-size: 10px; font-weight: 700; color: var(--text);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pitcher-stats {
        font-family: 'DM Mono', monospace;
        font-size: 9px; color: var(--muted-2); font-weight: 500;
    }
    .pitcher-headshot,
    .pitcher-headshot-small {
        width: 28px; height: 28px;
        border-radius: 50%; object-fit: cover; flex-shrink: 0;
        background: var(--surface-2);
    }

    /* ── Linescore (live + final) ───────────────────────── */
    .line-score-compact {
        overflow-x: auto;
        border-radius: 5px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        padding: 5px;
    }
    .line-score-compact table {
        width: 100%; border-collapse: collapse;
        font-size: 10px;
    }
    .line-score-compact th {
        font-family: 'DM Mono', monospace;
        font-weight: 600; color: var(--muted); font-size: 8px;
        text-transform: uppercase; letter-spacing: 0.4px;
        padding: 4px 5px; text-align: center;
    }
    .line-score-compact td {
        font-family: 'DM Mono', monospace;
        color: var(--text); font-weight: 500; padding: 4px 5px; text-align: center;
    }
    .line-score-compact .team-cell {
        font-family: 'Rubik', sans-serif;
        font-weight: 700; text-align: left; padding-left: 6px; min-width: 32px;
    }
    .line-score-compact .total {
        font-weight: 800; color: var(--text);
        background: rgba(4,30,66,0.04);
    }
    .line-score-compact tr { border-bottom: 1px solid var(--border); }
    .line-score-compact tr:last-child { border-bottom: none; }

    /* ── Player matchup (live games) ────────────────────── */
    .player-matchup-container {
        display: flex; gap: 8px;
        padding: 8px 0 0;
        border-top: 1px solid var(--border);
        justify-content: space-between;
        align-items: center;
    }

    /* Player card — left side (away team) is default; right side (home team) mirrors */
    .player-card {
        display: flex; align-items: center; gap: 7px;
        flex: 1; min-width: 0;
    }
    .player-card.right {
        flex-direction: row-reverse;
    }
    .player-card.right .player-info {
        text-align: right;
        align-items: flex-end;
    }

    .player-image {
        width: 32px; height: 32px;
        border-radius: 50%; object-fit: cover; flex-shrink: 0;
        background: var(--surface-2);
    }
    .player-info {
        display: flex; flex-direction: column; gap: 1px; min-width: 0;
    }
    .player-name {
        font-size: 11px; font-weight: 700; color: var(--text);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        max-width: 100%;
    }
    .player-position {
        font-size: 8px; color: var(--red); font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.5px;
    }
    .player-stats {
        font-family: 'DM Mono', monospace;
        font-size: 9px; color: var(--muted-2); font-weight: 500;
        display: flex; flex-direction: column; gap: 2px; text-align: left;
    }
    .player-stats span { margin-right: 6px; }
    .player-card.right .player-stats span { margin-right: 0; margin-left: 6px; }

    /* ── Venue ──────────────────────────────────────────── */
    .venue-info {
        display: flex; align-items: center; justify-content: flex-end; gap: 4px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-size: 9px; color: var(--muted);
        font-weight: 500;
    }
    .team-logo-venue { width: 14px; height: 14px; flex-shrink: 0; }

    /* ── Loading / empty states ─────────────────────────── */
    .state-msg {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 48px 20px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
    }
    .state-spinner {
        width: 16px; height: 16px;
        border: 2px solid var(--border);
        border-top-color: var(--red);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <header class="page-header">
        <img src="assets/teams-darkmode/1.svg" alt="MLB" class="header-logo">
        <span class="header-title">MLB Live Scores</span>
    </header>

    <div class="date-bar">
        <button class="date-arrow" id="date-prev" title="Previous day">
            <svg viewBox="0 0 13 13"><polyline points="9 2 4 6.5 9 11"/></svg>
        </button>
        <div class="date-display-wrap">
            <div class="date-display">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8"  y1="2" x2="8"  y2="6"/>
                    <line x1="3"  y1="10" x2="21" y2="10"/>
                </svg>
                <span class="date-display-text" id="date-display-text">Loading…</span>
            </div>
            <input type="date" id="date-input" class="date-input">
        </div>
        <button class="date-arrow" id="date-next" title="Next day">
            <svg viewBox="0 0 13 13"><polyline points="4 2 9 6.5 4 11"/></svg>
        </button>
        <button class="today-btn" id="today-btn">Today</button>
    </div>

    <div id="scorebug">
        <div id="games-container">
            <div class="state-msg">
                <div class="state-spinner"></div>
                Loading games…
            </div>
        </div>
    </div>

</body>
</html>
