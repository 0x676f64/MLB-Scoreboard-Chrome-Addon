<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standings — XLabs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="standings.js" defer></script>
    <script src="navigation.js" defer></script>
    <style>

    /* ── Reset & Base ────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --red:         #bf0d3d;
        --red-light:   rgba(191,13,61,0.08);
        --red-mid:     rgba(191,13,61,0.18);
        --navy:        #041e42;
        --navy-mid:    #0d2d5e;
        --navy-light:  rgba(4,30,66,0.06);
        --navy-border: rgba(4,30,66,0.1);
        --bg:          #f0f4f8;
        --surface:     #ffffff;
        --surface-2:   #f7fafc;
        --text:        #041e42;
        --text-muted:  rgba(4,30,66,0.45);
        --border:      rgba(4,30,66,0.09);
        --shadow-sm:   0 1px 4px rgba(4,30,66,0.08);
        --shadow-md:   0 4px 16px rgba(4,30,66,0.1);
        --radius:      10px;
        --radius-sm:   6px;
    }

    html {
        scrollbar-width: none;
        width: 700px;
        overflow-x: hidden;
    }
    html::-webkit-scrollbar { display: none; }

    body {
        font-family: 'Rubik', sans-serif;
        background: var(--bg);
        color: var(--text);
        width: 700px;
        overflow-x: hidden;
        /* No min-height — Chrome extension popup must shrink when content shrinks.
           min-height: 100vh creates a feedback loop: expanding content raises the
           viewport height, which raises the min-height floor, so the popup never
           shrinks back. Height is always driven by actual content only. */
    }

    /* ── Header ──────────────────────────────────────────────────────── */
    .standings-header {
        background: var(--navy);
        padding: 14px 16px 0;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .header-top {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
    }

    .header-logo {
        width: 32px;
        height: 32px;
        object-fit: contain;
        flex-shrink: 0;
    }

    .header-title {
        font-size: 13px;
        font-weight: 800;
        color: white;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    /* ── Year Navigator ──────────────────────────────────────────────── */
    .year-nav {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 2px;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 99px;
        padding: 2px 4px;
    }

    .year-arrow {
        width: 22px;
        height: 22px;
        border: none;
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: background 0.15s ease, opacity 0.15s ease;
        padding: 0;
        flex-shrink: 0;
    }

    .year-arrow:hover { background: rgba(255,255,255,0.12); }

    .year-arrow:disabled {
        opacity: 0.2;
        cursor: not-allowed;
    }

    .year-arrow svg {
        width: 12px;
        height: 12px;
        stroke: white;
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        display: block;
    }

    .year-display {
        font-family: 'DM Mono', monospace;
        font-size: 12px;
        font-weight: 500;
        color: white;
        min-width: 38px;
        text-align: center;
        letter-spacing: 0.5px;
        transition: opacity 0.15s ease;
        user-select: none;
    }

    .year-display.changing {
        opacity: 0;
        transform: scale(0.85);
    }

    /* Historical season banner — subtle pill below the header */
    .historical-banner {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 5px 14px;
        background: rgba(191,13,61,0.12);
        border-bottom: 1px solid rgba(191,13,61,0.18);
        font-size: 10px;
        font-weight: 600;
        color: var(--red);
        letter-spacing: 0.3px;
    }

    .historical-banner.visible { display: flex; }

    .historical-banner svg {
        width: 10px;
        height: 10px;
        stroke: var(--red);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        flex-shrink: 0;
    }

    /* ── Tab Nav ─────────────────────────────────────────────────────── */
    .tab-nav {
        display: flex;
        gap: 0;
        position: relative;
    }

    .tab-btn {
        flex: 1;
        padding: 10px 6px 12px;
        background: transparent;
        border: none;
        cursor: pointer;
        font-family: 'Rubik', sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.45);
        position: relative;
        transition: color 0.2s ease;
    }

    .tab-btn.active { color: white; }

    /* Animated underline indicator */
    .tab-btn::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 0;
        height: 2.5px;
        background: var(--red);
        border-radius: 2px 2px 0 0;
        transform: translateX(-50%);
        transition: width 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .tab-btn.active::after { width: 60%; }

    /* ── Content Area ────────────────────────────────────────────────── */
    #standings-container {
        padding: 12px 14px 14px;
        display: flex;
        flex-direction: row;
        gap: 10px;
    }

    /* ── Loading State ───────────────────────────────────────────────── */
    .loading-state {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 48px 24px;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 500;
    }

    .loading-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid var(--border);
        border-top-color: var(--red);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Division Card ───────────────────────────────────────────────── */
    .division-card {
        background: var(--surface);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        animation: cardIn 0.3s ease-out both;
        /* Cards stretch equally to fill the full container width */
        flex: 1;
        min-width: 0;
    }

    @keyframes cardIn {
        from { opacity: 0; transform: translateX(10px); }
        to   { opacity: 1; transform: translateX(0); }
    }

    .division-card:nth-child(2) { animation-delay: 0.06s; }
    .division-card:nth-child(3) { animation-delay: 0.12s; }

    /* Card header strip */
    .division-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px 9px;
        background: linear-gradient(135deg, var(--navy), var(--navy-mid));
        border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .division-header-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--red);
        flex-shrink: 0;
    }

    .division-name {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: white;
    }

    .division-season {
        margin-left: auto;
        font-family: 'DM Mono', monospace;
        font-size: 8px;
        color: rgba(255,255,255,0.28);
        letter-spacing: 0.3px;
    }

    /* Column header row */
    .col-header {
        display: grid;
        grid-template-columns: 24px 1fr 30px 30px 30px 48px;
        gap: 0;
        padding: 6px 10px 5px;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
    }

    .col-header span {
        font-family: 'DM Mono', monospace;
        font-size: 8px;
        font-weight: 500;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--text-muted);
        text-align: center;
    }

    .col-header span:nth-child(2) { text-align: left; padding-left: 4px; }

    /* ── Team Row ─────────────────────────────────────────────────────── */
    .team-row {
        display: grid;
        grid-template-columns: 24px 1fr 30px 30px 30px 48px;
        gap: 0;
        padding: 7px 10px;
        border-bottom: 1px solid var(--border);
        align-items: center;
        transition: background 0.12s ease;
        animation: rowIn 0.28s ease-out both;
        cursor: default;
    }

    .team-row:last-child { border-bottom: none; }
    .team-row:hover { background: var(--red-light); }

    /* Stagger each row */
    .team-row:nth-child(1) { animation-delay: 0.05s; }
    .team-row:nth-child(2) { animation-delay: 0.10s; }
    .team-row:nth-child(3) { animation-delay: 0.15s; }
    .team-row:nth-child(4) { animation-delay: 0.20s; }
    .team-row:nth-child(5) { animation-delay: 0.25s; }

    @keyframes rowIn {
        from { opacity: 0; transform: translateX(-8px); }
        to   { opacity: 1; transform: translateX(0); }
    }

    /* Playoff-clinch top line */
    .team-row.playoff-line {
        border-top: 1.5px solid rgba(191,13,61,0.35);
    }

    /* Position number */
    .team-pos {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        font-weight: 500;
        color: var(--text-muted);
        text-align: center;
    }

    .team-pos.first-place {
        color: var(--red);
        font-weight: 700;
    }

    /* Team identity cell */
    .team-identity {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        padding-left: 2px;
    }

    .team-logo {
        width: 24px;
        height: 24px;
        object-fit: contain;
        flex-shrink: 0;
        transition: transform 0.15s ease;
    }

    .team-row:hover .team-logo { transform: scale(1.1); }

    .team-abbr {
        font-size: 11px;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* Stat cells */
    .team-stat {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        font-weight: 500;
        color: var(--text);
        text-align: center;
    }

    .team-stat.muted { color: var(--text-muted); }

    /* Win % bar cell */
    .pct-cell {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
        padding-right: 2px;
    }

    .pct-value {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        font-weight: 500;
        color: var(--text);
    }

    .pct-bar-track {
        width: 42px;
        height: 3px;
        background: var(--border);
        border-radius: 2px;
        overflow: hidden;
    }

    .pct-bar-fill {
        height: 100%;
        background: var(--red);
        border-radius: 2px;
        transform-origin: left;
        animation: barGrow 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .team-row:nth-child(1) .pct-bar-fill { animation-delay: 0.08s; }
    .team-row:nth-child(2) .pct-bar-fill { animation-delay: 0.13s; }
    .team-row:nth-child(3) .pct-bar-fill { animation-delay: 0.18s; }
    .team-row:nth-child(4) .pct-bar-fill { animation-delay: 0.23s; }
    .team-row:nth-child(5) .pct-bar-fill { animation-delay: 0.28s; }

    @keyframes barGrow {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
    }

    /* First place gold accent */
    .team-row.leader .team-abbr { color: var(--red); }

    /* ── Wild Card specific ──────────────────────────────────────────── */
    .wc-league-label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px 7px;
        background: linear-gradient(135deg, var(--navy), var(--navy-mid));
        border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .wc-league-label span {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: white;
    }

    .wc-spots-badge {
        margin-left: auto;
        font-size: 8px;
        font-weight: 700;
        color: white;
        background: var(--red);
        padding: 2px 7px;
        border-radius: 99px;
        letter-spacing: 0.5px;
    }

    /* ── Navigation ──────────────────────────────────────────────────── */
    .nav-container {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 8px 0 10px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        position: sticky;
        bottom: 0;
        z-index: 100;
    }

    .nav-container button {
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        transition: background 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .nav-container button:hover { background: var(--navy-light); }

    .nav-container svg {
        width: 22px;
        height: 22px;
        fill: var(--text-muted);
        transition: fill 0.2s ease;
        display: block;
    }

    .nav-container button:hover svg { fill: var(--red); }
    .nav-container button.active svg { fill: var(--navy); }

    /* ── Playoff Bracket ─────────────────────────────────────────────── */

    .bracket-wrap {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* "Projected" vs actual season banner */
    .bracket-mode-banner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: var(--radius-sm);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.6px;
    }

    .bracket-mode-banner.projected {
        background: rgba(245,158,11,0.1);
        border: 1px solid rgba(245,158,11,0.25);
        color: #b45309;
    }

    .bracket-mode-banner.historical {
        background: rgba(16,185,129,0.08);
        border: 1px solid rgba(16,185,129,0.2);
        color: #065f46;
    }

    .bracket-mode-banner svg {
        width: 11px; height: 11px;
        stroke: currentColor; fill: none;
        stroke-width: 2; stroke-linecap: round;
        flex-shrink: 0;
    }

    /* Two league columns side by side */
    .bracket-leagues {
        display: flex;
        gap: 10px;
    }

    .bracket-league {
        flex: 1;
        min-width: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
    }

    .bracket-league-header {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 12px 7px;
        background: linear-gradient(135deg, var(--navy), var(--navy-mid));
    }

    .bracket-league-header-dot {
        width: 5px; height: 5px;
        border-radius: 50%;
        background: var(--red);
        flex-shrink: 0;
    }

    .bracket-league-name {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: white;
    }

    .bracket-league-note {
        margin-left: auto;
        font-family: 'DM Mono', monospace;
        font-size: 8px;
        color: rgba(255,255,255,0.35);
    }

    /* Round columns inside each league bracket */
    .bracket-rounds {
        display: flex;
        padding: 8px 6px;
        gap: 0;
        align-items: stretch;
    }

    .bracket-round {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .bracket-round-label {
        font-family: 'DM Mono', monospace;
        font-size: 7px;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--text-muted);
        text-align: center;
        margin-bottom: 5px;
        white-space: nowrap;
        overflow: hidden;
    }

    /* Connector column between rounds */
    .bracket-connector {
        width: 14px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    /* The matchup groupings within a round */
    .bracket-group {
        display: flex;
        flex-direction: column;
        gap: 0;
        position: relative;
    }

    /* Spacer to vertically align LCS with the midpoint of its two DS matchups */
    .bracket-spacer {
        flex: 1;
    }

    /* Individual matchup card */
    .bracket-matchup {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 5px;
        overflow: hidden;
        margin-bottom: 4px;
        position: relative;
        transition: box-shadow 0.15s ease;
    }

    .bracket-matchup:hover {
        box-shadow: 0 2px 8px rgba(4,30,66,0.1);
    }

    .bracket-matchup.bye-card {
        border-style: dashed;
        border-color: rgba(4,30,66,0.12);
    }

    /* Each team row inside a matchup */
    .bkt-team {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 6px;
        transition: background 0.12s;
        position: relative;
    }

    .bkt-team + .bkt-team {
        border-top: 1px solid var(--border);
    }

    .bkt-team.winner {
        background: rgba(191,13,61,0.06);
    }

    .bkt-team.loser {
        opacity: 0.45;
    }

    .bkt-team.tbd {
        opacity: 0.35;
    }

    .bkt-seed {
        font-family: 'DM Mono', monospace;
        font-size: 8px;
        font-weight: 700;
        color: var(--text-muted);
        width: 10px;
        text-align: center;
        flex-shrink: 0;
    }

    .bkt-seed.in-playoff {
        color: var(--red);
    }

    .bkt-logo {
        width: 18px;
        height: 18px;
        object-fit: contain;
        flex-shrink: 0;
    }

    .bkt-abbr {
        font-size: 9px;
        font-weight: 700;
        color: var(--text);
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .bkt-rec {
        font-family: 'DM Mono', monospace;
        font-size: 7.5px;
        color: var(--text-muted);
        flex-shrink: 0;
    }

    /* Winner check mark */
    .bkt-win-mark {
        width: 11px; height: 11px;
        border-radius: 50%;
        background: var(--red);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .bkt-win-mark svg {
        width: 7px; height: 7px;
        stroke: white; fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    /* Series result badge (e.g. "3-1") */
    .bkt-series-result {
        position: absolute;
        top: 50%;
        right: 3px;
        transform: translateY(-50%);
        font-family: 'DM Mono', monospace;
        font-size: 7px;
        font-weight: 700;
        color: var(--red);
        background: rgba(191,13,61,0.1);
        padding: 1px 4px;
        border-radius: 3px;
        pointer-events: none;
    }

    /* Round connector lines (CSS bracket lines) */
    .bkt-connector-top,
    .bkt-connector-bot {
        flex: 1;
        border-right: 1.5px solid var(--border);
    }

    .bkt-connector-top { border-bottom: 1.5px solid var(--border); }
    .bkt-connector-bot { border-top: 1.5px solid var(--border); }

    .bkt-connector-mid {
        width: 14px;
        height: 1.5px;
        background: var(--border);
        align-self: center;
    }

    /* LCS matchup sits in the vertical middle */
    .lcs-wrap {
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex: 1;
    }

    /* World Series banner at bottom */
    .bracket-ws {
        background: linear-gradient(135deg, var(--navy), var(--navy-mid));
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: var(--radius);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 14px;
        box-shadow: var(--shadow-md);
        animation: cardIn 0.35s ease-out 0.2s both;
    }

    .ws-label {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.45);
        flex-shrink: 0;
    }

    .ws-matchup {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
    }

    .ws-team {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
    }

    .ws-team.right { flex-direction: row-reverse; }

    .ws-logo {
        width: 30px; height: 30px;
        object-fit: contain;
        flex-shrink: 0;
    }

    .ws-team-name {
        font-size: 12px;
        font-weight: 700;
        color: white;
        white-space: nowrap;
    }

    .ws-league-badge {
        font-family: 'DM Mono', monospace;
        font-size: 8px;
        color: rgba(255,255,255,0.35);
        white-space: nowrap;
    }

    .ws-vs {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        color: rgba(255,255,255,0.3);
        flex-shrink: 0;
    }

    /* World Series champion crown */
    .ws-champion {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        flex: 1;
    }

    .ws-crown {
        font-size: 18px;
        line-height: 1;
    }

    .ws-champ-logo {
        width: 40px; height: 40px;
        object-fit: contain;
    }

    .ws-champ-name {
        font-size: 12px;
        font-weight: 800;
        color: white;
        text-align: center;
    }

    .ws-champ-result {
        font-family: 'DM Mono', monospace;
        font-size: 9px;
        color: rgba(255,255,255,0.45);
    }

    .ws-runner-up {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        opacity: 0.5;
    }

    .ws-runner-up-logo {
        width: 28px; height: 28px;
        object-fit: contain;
    }

    .ws-runner-up-name {
        font-size: 10px;
        font-weight: 600;
        color: rgba(255,255,255,0.6);
    }

    /* "Projected" TBD slot */
    .bkt-tbd-logo {
        width: 18px; height: 18px;
        border-radius: 50%;
        background: var(--border);
        flex-shrink: 0;
    }

    /* Animate bracket rows in */
    .bracket-matchup { animation: rowIn 0.25s ease-out both; }
    .bracket-matchup:nth-child(1) { animation-delay: 0.05s; }
    .bracket-matchup:nth-child(2) { animation-delay: 0.10s; }
    .bracket-matchup:nth-child(3) { animation-delay: 0.15s; }
    .bracket-matchup:nth-child(4) { animation-delay: 0.20s; }

    /* ── Slide transition on tab switch ─────────────────────────────── */
    .slide-exit {
        animation: slideExit 0.16s ease-in forwards;
    }

    @keyframes slideExit {
        to { opacity: 0; transform: translateY(4px); }
    }

    </style>
