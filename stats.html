    <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --red:        #bf0d3d;
        --navy:       #041e42;
        --navy-mid:   #0d2d5e;
        --bg:         #f0f4f8;
        --surface:    #ffffff;
        --surface-2:  #f7fafc;
        --text:       #041e42;
        --text-muted: rgba(4,30,66,0.42);
        --border:     rgba(4,30,66,0.09);
        --radius:     10px;
        --shadow-sm:  0 1px 4px rgba(4,30,66,0.08);
    }

    html { scrollbar-width: thin; scrollbar-color: var(--red) transparent; width: 700px; }
    html::-webkit-scrollbar { width: 4px; }
    html::-webkit-scrollbar-thumb { background: var(--red); border-radius: 2px; }

    body {
        font-family: 'Rubik', sans-serif;
        background: var(--bg);
        color: var(--text);
        width: 700px;
        overflow-x: hidden;
    }

    /* ── Header ── */
    .page-header {
        background: var(--navy);
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .header-logo {
        width: 30px; height: 30px;
        object-fit: contain; flex-shrink: 0;
    }

    .header-title {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: white;
    }

    .leaderboard-btn {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 5px 12px;
        background: transparent;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 99px;
        color: rgba(255,255,255,0.7);
        font-family: 'Rubik', sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-decoration: none;
        cursor: pointer;
        transition: color 0.18s, border-color 0.18s;
    }

    .leaderboard-btn:hover {
        color: white;
        border-color: rgba(255,255,255,0.5);
    }

    .leaderboard-btn svg {
        width: 10px; height: 10px;
        stroke: currentColor; fill: none;
        stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── Content ── */
    .content {
        padding: 16px 16px 12px;
        display: flex;
        gap: 12px;
    }

    /* ── League column ── */
    .league-col {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .league-header {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 10px 6px;
        background: linear-gradient(135deg, var(--navy), var(--navy-mid));
        border-radius: var(--radius) var(--radius) 0 0;
    }

    .league-dot {
        width: 5px; height: 5px;
        border-radius: 50%;
        background: var(--red);
        flex-shrink: 0;
    }

    .league-name {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: white;
    }

    /* ── Division block ── */
    .division-block {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
    }

    .division-label {
        padding: 5px 10px 4px;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
        font-size: 7.5px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .division-teams {
        display: flex;
        padding: 8px 4px;
    }

    /* ── Team cell ── */
    .team-cell {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 6px 4px;
        text-decoration: none;
        border-radius: 6px;
        transition: background 0.12s;
        cursor: pointer;
    }

    .team-cell:hover {
        background: rgba(191,13,61,0.06);
    }

    .team-cell:hover .team-logo-img {
        transform: scale(1.15);
        filter: drop-shadow(0 2px 8px rgba(191,13,61,0.35));
    }

    .team-logo-img {
        width: 44px;
        height: 44px;
        object-fit: contain;
        transition: transform 0.18s ease, filter 0.18s ease;
        animation: logoFadeIn 0.3s ease-out both;
    }

    @keyframes logoFadeIn {
        from { opacity: 0; transform: scale(0.85); }
        to   { opacity: 1; transform: scale(1); }
    }

    .team-abbr-label {
        font-family: 'DM Mono', monospace;
        font-size: 8px;
        font-weight: 700;
        color: var(--text-muted);
        letter-spacing: 0.3px;
        text-transform: uppercase;
    }

    /* Stagger team logo animations */
    .team-cell:nth-child(1) .team-logo-img { animation-delay: 0.03s; }
    .team-cell:nth-child(2) .team-logo-img { animation-delay: 0.06s; }
    .team-cell:nth-child(3) .team-logo-img { animation-delay: 0.09s; }
    .team-cell:nth-child(4) .team-logo-img { animation-delay: 0.12s; }
    .team-cell:nth-child(5) .team-logo-img { animation-delay: 0.15s; }

    /* ── Nav ── */
    .nav-container {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 8px 0 10px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        position: sticky;
        bottom: 0;
        z-index: 100;
    }

    .nav-container button {
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px 12px;
        border-radius: 6px;
        transition: background 0.15s;
        display: flex; align-items: center; justify-content: center;
    }

    .nav-container button:hover { background: rgba(4,30,66,0.06); }

    .nav-container svg {
        width: 22px; height: 22px;
        fill: var(--text-muted);
        transition: fill 0.2s;
        display: block;
    }

    .nav-container button:hover svg { fill: var(--red); }
    .nav-container button.active svg { fill: var(--navy); }

    </style>
