<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLabs — Player Stats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="navigation.js" defer></script>
    <script src="player-stats.js" defer></script>
    <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --navy:      #041e42;
        --navy-mid:  #0d2d5e;
        --red:       #bf0d3d;
        --red-soft:  rgba(191,13,61,0.08);
        --bg:        #f0f4f8;
        --surface:   #ffffff;
        --surface-2: #f7fafc;
        --text:      #041e42;
        --muted:     rgba(4,30,66,0.42);
        --muted-2:   rgba(4,30,66,0.6);
        --border:    rgba(4,30,66,0.11);
        --shadow-sm: 0 1px 4px rgba(4,30,66,0.06);
        --shadow:    0 4px 14px rgba(4,30,66,0.08);
        --container: 700px;

        --hot-bg:    #fde7ed;
        --hot-fg:    #bf0d3d;
        --steady-bg: #e3eaf3;
        --steady-fg: #041e42;
        --cold-bg:   #d8e9fa;
        --cold-fg:   #1976d2;

        --good-bg: #e0f3eb;
        --good-fg: #007d56;
        --bad-bg:  #fdeaea;
        --bad-fg:  #c62828;
    }

    html { scrollbar-width: none; }
    html::-webkit-scrollbar { width: 0; background: transparent; }

    body {
        font-family: 'Rubik', sans-serif;
        background: var(--bg);
        color: var(--text);
        width: var(--container);
        margin: 0 auto;
        padding-bottom: 70px;        /* clear the fixed bottom nav */
        min-height: 100vh;
    }

    /* ── Sticky header ───────────────────────────────────── */
    .top-bar {
        background: linear-gradient(135deg, var(--navy), var(--navy-mid));
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .top-bar-logo  { width: 30px; height: 30px; object-fit: contain; flex-shrink: 0; }
    .top-bar-title {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 2.4px;
        text-transform: uppercase;
        color: white;
    }
    .top-bar-spacer { flex: 1; }
    .top-bar-meta {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        color: rgba(255,255,255,0.55);
        font-weight: 500;
    }

    /* ── Search section ──────────────────────────────────── */
    .search-section {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 14px 16px;
        position: sticky;
        top: 50px;
        z-index: 90;
        box-shadow: var(--shadow-sm);
    }

    .search-bar {
        position: relative;
        display: flex;
        gap: 8px;
    }

    .search-input-wrap {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
    }

    .search-input-wrap svg.search-icon {
        position: absolute;
        left: 14px;
        width: 14px; height: 14px;
        stroke: var(--muted);
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
    }

    #player-search {
        flex: 1;
        width: 100%;
        padding: 10px 38px 10px 38px;
        font-family: 'Rubik', sans-serif;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 22px;
        outline: none;
        transition: border-color 0.16s, box-shadow 0.16s, background 0.16s;
    }

    #player-search:focus {
        border-color: var(--navy);
        background: var(--surface);
        box-shadow: 0 0 0 3px rgba(4,30,66,0.08);
    }

    #player-search::placeholder { color: var(--muted); font-weight: 400; }

    .search-clear {
        position: absolute;
        right: 8px;
        width: 22px; height: 22px;
        background: var(--border);
        border: none;
        border-radius: 50%;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        transition: background 0.14s;
    }
    .search-clear:hover { background: rgba(4,30,66,0.2); }
    .search-clear svg {
        width: 9px; height: 9px;
        stroke: white;
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
    }
    .search-clear.visible { display: flex; }

    .search-btn {
        background: var(--red);
        color: white;
        border: none;
        border-radius: 22px;
        padding: 0 18px;
        font-family: 'Rubik', sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.14s, transform 0.14s;
        flex-shrink: 0;
    }
    .search-btn:hover { background: #a40b34; transform: translateY(-1px); }
    .search-btn:active { transform: translateY(0); }

    /* Suggestions dropdown */
    .suggestions {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 70px;     /* leave room for the search button */
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(4,30,66,0.18);
        overflow: hidden;
        max-height: 320px;
        overflow-y: auto;
        z-index: 200;
    }

    .sg-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--border);
        width: 100%;
        cursor: pointer;
        text-align: left;
        font-family: inherit;
        transition: background 0.12s;
    }
    .sg-item:last-child { border-bottom: none; }
    .sg-item:hover, .sg-item.active { background: var(--surface-2); }

    .sg-photo {
        width: 36px; height: 36px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        background: var(--border);
    }
    .sg-info { flex: 1; min-width: 0; }
    .sg-name {
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .sg-meta {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        color: var(--muted-2);
        font-weight: 500;
        margin-top: 1px;
    }
    .sg-empty {
        padding: 16px 14px;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
        font-style: italic;
    }

    /* ── States ──────────────────────────────────────────── */
    .empty-state, .loading-state, .error-state {
        padding: 60px 24px;
        text-align: center;
        color: var(--muted);
    }

    .empty-state-icon {
        width: 56px; height: 56px;
        margin: 0 auto 14px;
        opacity: 0.4;
    }
    .empty-state-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 4px;
    }
    .empty-state-msg {
        font-size: 12px;
        color: var(--muted-2);
        max-width: 320px;
        margin: 0 auto;
        line-height: 1.5;
    }

    .loading-state { display: none; }
    .loading-state.visible { display: block; }
    .loading-spinner {
        width: 22px; height: 22px;
        margin: 0 auto 12px;
        border: 3px solid var(--border);
        border-top-color: var(--red);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-state { display: none; color: var(--red); }
    .error-state.visible { display: block; }

    /* ── Player content (profile + stats) ────────────────── */
    .player-content { display: none; padding: 14px 16px; }
    .player-content.visible { display: block; }

    /* Profile card */
    .profile-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 12px;
    }

    .profile-headshot {
        width: 80px; height: 80px;
        border-radius: 50%;
        background: var(--surface-2);
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
        border: 3px solid var(--red);
    }
    .profile-headshot img {
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
    }

    .profile-info {
        flex: 1;
        min-width: 0;
    }
    .profile-name {
        font-family: 'Rubik', sans-serif;
        font-size: 22px;
        font-weight: 800;
        color: var(--text);
        line-height: 1.1;
        margin-bottom: 4px;
        letter-spacing: -0.3px;
    }
    .profile-position {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted-2);
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
    }
    .profile-team-logo { width: 16px; height: 16px; object-fit: contain; }
    .profile-dot {
        width: 3px; height: 3px;
        border-radius: 50%;
        background: var(--muted);
        display: inline-block;
    }
    .profile-details {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        color: var(--muted);
        font-weight: 500;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    .profile-details span { display: inline-flex; align-items: center; gap: 5px; }
    .profile-details strong {
        color: var(--text);
        font-weight: 600;
    }

    /* Status badges row */
    .status-row {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        flex-wrap: wrap;
    }

    .status-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 7px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.3px;
        flex: 1;
        min-width: 0;
        border: 1px solid transparent;
    }

    .status-badge.qualified { background: var(--good-bg); color: var(--good-fg); border-color: rgba(0,125,86,0.25); }
    .status-badge.not-qualified { background: var(--bad-bg);  color: var(--bad-fg);  border-color: rgba(198,40,40,0.25); }

    .status-badge.hot    { background: var(--hot-bg);    color: var(--hot-fg);    border-color: rgba(191,13,61,0.25); }
    .status-badge.steady { background: var(--steady-bg); color: var(--steady-fg); border-color: rgba(4,30,66,0.18); }
    .status-badge.cold   { background: var(--cold-bg);   color: var(--cold-fg);   border-color: rgba(25,118,210,0.25); }
    .status-badge.no-data { background: var(--surface-2); color: var(--muted-2); border-color: var(--border); font-style: italic; }

    .status-badge .badge-emoji { font-size: 13px; line-height: 1; }
    .status-badge .badge-text  { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-badge .badge-value {
        font-family: 'DM Mono', monospace;
        font-weight: 600;
    }

    /* ── Stats card ──────────────────────────────────────── */
    .stats-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow-sm);
        overflow: hidden;
    }

    /* Tabs (only shown for two-way players) */
    .stats-tabs {
        display: none;
        position: relative;
        border-bottom: 1px solid var(--border);
        background: var(--surface-2);
    }
    .stats-tabs.visible { display: flex; }
    .tab-btn {
        background: transparent;
        border: none;
        padding: 11px 20px;
        font-family: 'Rubik', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.2px;
        color: var(--muted-2);
        cursor: pointer;
        text-transform: uppercase;
        transition: color 0.18s;
        position: relative;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--text); }
    .tab-underline {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 2px;
        background: var(--red);
        transition: left 0.22s ease, width 0.22s ease;
    }

    /* Stats header */
    .stats-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 12px 14px 10px;
        border-bottom: 1px solid var(--border);
    }
    .stats-title {
        font-family: 'Rubik', sans-serif;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text);
    }
    .stats-subtitle {
        font-family: 'DM Mono', monospace;
        font-size: 9.5px;
        font-weight: 500;
        color: var(--muted-2);
    }

    /* Stats grid */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 10px 12px 12px;
    }

    /* Compact stat card — same elements, ~25% less vertical space */
    .sc {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 9px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-height: 60px;
        position: relative;
    }

    .sc-name {
        font-family: 'Rubik', sans-serif;
        font-size: 8.5px;
        font-weight: 700;
        color: var(--muted-2);
        text-transform: uppercase;
        letter-spacing: 0.6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .sc-value {
        font-family: 'Rubik', sans-serif;
        font-size: 17px;
        font-weight: 800;
        color: var(--text);
        line-height: 1.05;
        letter-spacing: -0.3px;
    }

    .sc-bar-wrap {
        position: relative;
        height: 5px;
        background: rgba(4,30,66,0.06);
        border-radius: 3px;
        margin-top: 3px;
        overflow: visible;
    }

    .sc-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        border-radius: 3px;
        width: 0%;
        transition: width 0.9s cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    .sc-circle {
        position: absolute;
        top: 50%;
        transform: translate(0, -50%);
        right: -7px;
        width: 14px; height: 14px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Rubik', sans-serif;
        font-size: 7px;
        font-weight: 800;
        color: white;
        box-shadow: 0 0 0 1.25px white, 0 1px 2px rgba(0,0,0,0.2);
        transition: left 0.9s cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    .sc-rank {
        font-family: 'DM Mono', monospace;
        font-size: 7.5px;
        font-weight: 500;
        color: var(--muted);
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .sc.unqualified .sc-value { color: var(--muted-2); }
    .sc.unqualified .sc-circle { background: var(--muted) !important; }
    .sc.unqualified .sc-bar    { opacity: 0.35; }

    /* ── Bottom nav ──────────────────────────────────────── */
    .nav-container {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: var(--container);
        height: 56px;
        background: rgba(255,255,255,0.94);
        backdrop-filter: blur(10px);
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 150;
        box-shadow: 0 -2px 12px rgba(4,30,66,0.06);
    }

    .nav-container button {
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px 14px;
        border-radius: 8px;
        transition: background 0.14s;
    }
    .nav-container button:hover { background: var(--surface-2); }

    .nav-container svg {
        height: 22px; width: 22px;
        fill: var(--muted);
        transition: fill 0.16s;
    }
    .nav-container button:hover svg,
    .nav-container button.active svg { fill: var(--red); }

    </style>
</head>
<body>

    <header class="top-bar">
        <img src="assets/teams-darkmode/1.svg" alt="" class="top-bar-logo">
        <span class="top-bar-title">XLabs · Player Stats</span>
        <span class="top-bar-spacer"></span>
        <span class="top-bar-meta" id="season-label">2026 Season</span>
    </header>

    <div class="search-section">
        <div class="search-bar">
            <div class="search-input-wrap">
                <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
                <input type="text" id="player-search" placeholder="Search for a player..." autocomplete="off" spellcheck="false">
                <button type="button" class="search-clear" id="search-clear" aria-label="Clear">
                    <svg viewBox="0 0 12 12"><path d="M2 2 L10 10 M10 2 L2 10"/></svg>
                </button>
            </div>
            <button type="button" class="search-btn" id="search-button">Search</button>
            <div class="suggestions" id="suggestions" hidden></div>
        </div>
    </div>

    <div class="empty-state" id="empty-state">
        <svg class="empty-state-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="32" cy="32" r="24"/>
            <path d="M16 18 Q32 32 16 46"/>
            <path d="M48 18 Q32 32 48 46"/>
        </svg>
        <div class="empty-state-title">Search for a player</div>
        <div class="empty-state-msg">Type any MLB player's name above to view their season stats with league percentile rankings.</div>
    </div>

    <div class="loading-state" id="loading-state">
        <div class="loading-spinner"></div>
        <div style="font-size:12px; color: var(--muted-2); font-weight: 500;">Loading player data…</div>
    </div>

    <div class="error-state" id="error-state"></div>

    <div class="player-content" id="player-content">
        <!-- Profile -->
        <div class="profile-card">
            <div class="profile-headshot" id="profile-headshot"></div>
            <div class="profile-info">
                <div class="profile-name" id="profile-name"></div>
                <div class="profile-position" id="profile-position"></div>
                <div class="profile-details" id="profile-details"></div>
            </div>
        </div>

        <!-- Status badges (qualification + recent performance) -->
        <div class="status-row" id="status-row"></div>

        <!-- Stats -->
        <div class="stats-card">
            <div class="stats-tabs" id="stats-tabs">
                <button type="button" class="tab-btn" data-mode="hitting">Hitting</button>
                <button type="button" class="tab-btn" data-mode="pitching">Pitching</button>
                <div class="tab-underline" id="tab-underline"></div>
            </div>
            <div class="stats-header">
                <span class="stats-title" id="stats-title">Season Stats</span>
                <span class="stats-subtitle" id="stats-subtitle"></span>
            </div>
            <div class="stats-grid" id="stats-grid"></div>
        </div>
    </div>

    <nav class="nav-container">
        <button id="home-btn" title="Home">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/></svg>
        </button>
        <button id="standings-btn" title="Standings">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M120-80v-60h100v-30h-60v-60h60v-30H120v-60h120q17 0 28.5 11.5T280-280v40q0 17-11.5 28.5T240-200q17 0 28.5 11.5T280-160v40q0 17-11.5 28.5T240-80H120Zm0-280v-110q0-17 11.5-28.5T160-510h60v-30H120v-60h120q17 0 28.5 11.5T280-560v70q0 17-11.5 28.5T240-450h-60v30h100v60H120Zm60-280v-180h-60v-60h120v240h-60Zm180 440v-80h480v80H360Zm0-240v-80h480v80H360Zm0-240v-80h480v80H360Z"/></svg>
        </button>
        <button id="stats-btn" title="Team Stats">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M120-120v-80l80-80v160h-80Zm160 0v-240l80-80v320h-80Zm160 0v-320l80 81v239h-80Zm160 0v-239l80-80v319h-80Zm160 0v-400l80-80v480h-80ZM120-327v-113l280-280 160 160 280-280v113L560-447 400-607 120-327Z"/></svg>
