<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLabs — Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="default.js"    defer></script>
    <script src="navigation.js" defer></script>
    <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
        scrollbar-width: thin;
        scrollbar-color: #bf0d3d transparent;
        width: 700px;
        overflow-x: hidden;
    }

    body {
        font-family: 'Rubik', sans-serif;
        background: #f0f4f8;
        color: #041e42;
        width: 700px;
        overflow-x: hidden;
    }

    /* Sticky navy header */
    .page-header {
        background: linear-gradient(135deg, #041e42, #0d2d5e);
        padding: 14px 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .header-logo { width: 60px; height: 60px; object-fit: contain; flex-shrink: 0; }

    .header-title {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: white;
    }

    .floating-btn {
        margin-left: auto;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 8px;
        width: 32px; height: 32px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
        flex-shrink: 0;
        padding: 0;
    }

    .floating-btn:hover { background: rgba(255,255,255,0.14); }
    .floating-btn img   { width: 18px; height: 18px; object-fit: contain; opacity: 0.8; }
    .floating-btn:hover img { opacity: 1; }

    /* Date bar — polished nav-style picker */
    .date-bar {
        background: #ffffff;
        border-bottom: 1px solid rgba(4,30,66,0.09);
        padding: 10px 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 1px 4px rgba(4,30,66,0.05);
    }

    /* Day arrow buttons */
    .date-arrow {
        width: 28px; height: 28px;
        border: 1px solid rgba(4,30,66,0.13);
        border-radius: 7px;
        background: #f7fafc;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
        flex-shrink: 0;
        padding: 0;
    }

    .date-arrow:hover {
        background: #041e42;
        border-color: #041e42;
    }

    .date-arrow:hover svg { stroke: white; }

    .date-arrow svg {
        width: 13px; height: 13px;
        stroke: rgba(4,30,66,0.5);
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    /* Clickable date display that reveals the native picker */
    .date-display-wrap {
        position: relative;
        flex: 1;
        min-width: 0;
    }

    .date-display {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #f7fafc;
        border: 1px solid rgba(4,30,66,0.13);
        border-radius: 9px;
        padding: 7px 12px;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
        user-select: none;
    }

    .date-display:hover {
        border-color: #041e42;
        background: white;
    }

    /* Calendar icon */
    .date-display svg {
        width: 14px; height: 14px;
        stroke: #bf0d3d;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
    }

    .date-display-text {
        font-family: 'Rubik', sans-serif;
        font-size: 12px;
        font-weight: 600;
        color: #041e42;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* Hidden native date input overlaid for calendar popup */
    .date-input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
    }

    /* Today button */
    .today-btn {
        font-family: 'Rubik', sans-serif;
        font-size: 10px;
        font-weight: 700;
        background: transparent;
        color: rgba(4,30,66,0.45);
        border: 1px solid rgba(4,30,66,0.13);
        border-radius: 7px;
        padding: 7px 11px;
        cursor: pointer;
        transition: all 0.15s;
        letter-spacing: 0.3px;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .today-btn:hover { border-color: #bf0d3d; color: #bf0d3d; }

    /* Games grid */
    #scorebug { padding: 12px 14px 0; }

    #games-container {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
    }

    /* Game card — original flat-ish shape, not too round */
    .game-box {
        background: #ffffff;
        border: 1px solid rgba(4,30,66,0.12);
        border-radius: 5px;
        padding: 8px 8px 7px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(4,30,66,0.07);
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-height: 90px;
    }

    .game-box:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 6px 20px rgba(191,13,61,0.18);
        border-color: rgba(191,13,61,0.35);
    }

    .game-box.live { border-left: 3px solid #bf0d3d; }

    /* Status — plain red text, no background */
    .game-status {
        font-family: 'Rubik', sans-serif;
        font-size: 9px;
        font-weight: 700;
        color: #bf0d3d;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 5px;
        min-height: 16px;
    }

    /* Live ping — red circle with expanding ring */
    .live-ring {
        position: relative;
        width: 8px; height: 8px;
        flex-shrink: 0;
    }

    /* Solid center dot */
    .live-ring::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: #bf0d3d;
    }

    /* Expanding fade-out ring */
    .live-ring::before {
        content: '';
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        border: 1.5px solid #bf0d3d;
        animation: livePing 1.6s ease-out infinite;
        opacity: 0;
    }

    @keyframes livePing {
        0%   { transform: scale(0.6); opacity: 0.9; }
        100% { transform: scale(2.2); opacity: 0; }
    }

    /* Team row */
    .team-row {
        display: flex;
        align-items: center;
        gap: 5px;
        width: 100%;
    }

    .team-logo {
        width: 22px; height: 22px;
        object-fit: contain;
        flex-shrink: 0;
        transition: transform 0.15s;
    }

    .game-box:hover .team-logo { transform: scale(1.08); }

    .team-abbr {
        font-family: 'Rubik', sans-serif;
        font-size: 11px;
        font-weight: 500;
        color: #041e42;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .team-score {
        font-family: 'Rubik', sans-serif;
        font-size: 15px;
        font-weight: 600;
        color: #041e42;
        min-width: 18px;
        text-align: right;
    }

    /* Winner/loser tinting (final games only) */
    .team-row.winner .team-score { color: #041e42; font-weight: 700; }
    .team-row.loser  .team-score { color: rgba(4,30,66,0.32); }
    .team-row.loser  .team-abbr  { color: rgba(4,30,66,0.42); }

    .card-divider {
        height: 1px;
        background: rgba(4,30,66,0.07);
        margin: 1px 0;
    }

    /* Loading/empty state */
    .state-msg {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 40px 20px;
        color: rgba(4,30,66,0.4);
        font-size: 12px;
        font-weight: 500;
    }

    .state-spinner {
        width: 16px; height: 16px;
        border: 2px solid rgba(4,30,66,0.1);
        border-top-color: #bf0d3d;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Nav */
    .nav-container {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 8px 0 10px;
        background: #ffffff;
        border-top: 1px solid rgba(4,30,66,0.09);
        position: sticky;
        bottom: 0;
        z-index: 100;
        width: 700px;
        margin-top: 12px;
    }

    .nav-container button {
        background: none; border: none; cursor: pointer;
        padding: 8px 12px; border-radius: 6px;
        transition: background 0.15s;
        display: flex; align-items: center; justify-content: center;
    }

    .nav-container button:hover { background: rgba(4,30,66,0.05); }

    .nav-container svg {
        width: 22px; height: 22px;
        fill: rgba(4,30,66,0.42);
        transition: fill 0.2s;
        display: block;
    }

    .nav-container button:hover svg { fill: #bf0d3d; }
    .nav-container button.active   svg { fill: #041e42; }

    </style>
</head>
